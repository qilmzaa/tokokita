<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TokoKita — Sistem Informasi Penjualan Toko, proyek XII RPL 1."
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>TokoKita — Sistem Informasi Penjualan</title>
    <script>
      ;(() => {
        try {
          const tersimpan = localStorage.getItem('tokokita-theme')
          const gelap = tersimpan
            ? tersimpan === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (gelap) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = gelap ? 'dark' : 'light'
        } catch {
          /* abaikan bila localStorage tidak tersedia */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
